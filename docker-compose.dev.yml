services:
  postgres:
    image: postgres:16.13-alpine3.23
    container_name: board-forge-db
    user: postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: board_forge_db
      POSTGRES_USER: board_forge_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    cap_drop:
      - ALL
    mem_limit: 512M
    cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board_forge_user -d board_forge_db -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  pg_data:
